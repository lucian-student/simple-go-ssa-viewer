services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: react_vite_dev
    ports:
      - "5173:5173"
    volumes:
      # Bind mount host directory into container for native Linux HMR
      - .:/app
      # Anonymous volume prevents host directory from overwriting container node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Instructs Vite to auto-open browser or bind cleanly inside container network
      - VITE_PORT=5173
    stdin_open: true
    tty: true
    restart: unless-stopped